name: Yaban Token Güncelle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Requests kur
        run: pip install requests

      - name: yaban.py çalıştır
        run: python yaban.py

      - name: yaban.m3u8 kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yaban.m3u8
          git diff --cached --quiet || git commit -m "Yaban token güncellendi"
          git push
